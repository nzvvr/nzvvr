<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Javier Sepúlveda, Software Engineer y AI Engineer</title>
  <desc id="desc">Encabezado editorial del perfil nzvvr, enfocado en software, inteligencia artificial y diseño.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B14"/>
      <stop offset="0.55" stop-color="#0D1222"/>
      <stop offset="1" stop-color="#10162B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#94A3B8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="420" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#background)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <circle cx="1030" cy="80" r="330" fill="url(#glow)"/>
    <circle cx="1110" cy="-50" r="190" fill="#7C3AED" opacity="0.08"/>
    <path d="M0 2 H1200" stroke="url(#accent)" stroke-width="4"/>

    <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      <g font-size="14" font-weight="700" letter-spacing="2.4">
        <text x="64" y="69" fill="#60A5FA">NZVVR / PROFILE</text>
        <text x="1136" y="69" fill="#64748B" text-anchor="end">SOFTWARE × INTELLIGENCE × DESIGN</text>
      </g>

      <text x="64" y="177" fill="#F8FAFC" font-size="62" font-weight="760" letter-spacing="-2.5">Javier Sepúlveda</text>
      <text x="64" y="222" fill="url(#accent)" font-size="24" font-weight="650" letter-spacing="0.4">@nzvvr · Software Engineer · AI Engineer</text>

      <text x="64" y="279" fill="#A8B3C7" font-size="20" font-weight="430">
        Construyo productos inteligentes, plataformas modernas e interfaces cuidadas.
      </text>

      <g transform="translate(64 326)" font-size="13" font-weight="700" letter-spacing="1.1">
        <g>
          <rect width="168" height="42" rx="21" fill="#111B31" stroke="#2B4168"/>
          <circle cx="22" cy="21" r="4" fill="#60A5FA"/>
          <text x="38" y="26" fill="#CBD5E1">4+ AÑOS SOFTWARE</text>
        </g>
        <g transform="translate(184 0)">
          <rect width="132" height="42" rx="21" fill="#111B31" stroke="#2B4168"/>
          <circle cx="22" cy="21" r="4" fill="#22D3EE"/>
          <text x="38" y="26" fill="#CBD5E1">2+ AÑOS IA</text>
        </g>
        <g transform="translate(332 0)">
          <rect width="282" height="42" rx="21" fill="#111B31" stroke="#2B4168"/>
          <circle cx="22" cy="21" r="4" fill="#A78BFA"/>
          <text x="38" y="26" fill="#CBD5E1">PRODUCTOS · PLATAFORMAS · IA</text>
        </g>
      </g>
    </g>

    <g transform="translate(1018 188)" opacity="0.88">
      <circle r="86" fill="none" stroke="#334155" stroke-width="1"/>
      <circle r="58" fill="none" stroke="#3B82F6" stroke-opacity="0.42" stroke-width="1" stroke-dasharray="4 8"/>
      <circle r="8" fill="#22D3EE"/>
      <circle cx="0" cy="-86" r="5" fill="#60A5FA"/>
      <circle cx="58" cy="0" r="5" fill="#A78BFA"/>
      <path d="M0 -58 L58 0 L0 58 L-58 0 Z" fill="none" stroke="url(#accent)" stroke-width="2"/>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="27.25" fill="none" stroke="#26324A" stroke-width="1.5"/>
</svg>
